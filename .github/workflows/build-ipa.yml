name: Build unsigned iPhone IPA

on:
  push:
    branches: [main]
    paths: ['IndianMusic/**', 'IndianMusic.xcodeproj/**', 'UITests/**', 'App.xcconfig', 'scripts/**', '.github/workflows/build-ipa.yml']
  workflow_dispatch:
    inputs:
      diagnose:
        description: Run only the offline-sampler comparison experiment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.diagnose }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record available Xcode and SDK
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Test six taals and native shared-engine tabla transport
        run: bash scripts/test-phase5.sh
      - name: Test tuning and render both tanpuras across loop boundaries
        run: bash scripts/test-phase3.sh
      - name: Test sampled harmonium and simultaneous audio
        run: bash scripts/test-phase4.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure rendered pitch with existing aubio
        shell: bash
        run: |
          python -m venv build/pitch-venv
          source build/pitch-venv/bin/activate
          pip install 'numpy==1.26.4' 'setuptools<81' wheel
          mkdir -p build/empty-pkgconfig
          PKG_CONFIG_LIBDIR="$PWD/build/empty-pkgconfig" PKG_CONFIG_PATH="$PWD/build/empty-pkgconfig" ARCHFLAGS="-arch arm64" CFLAGS="-Wno-error=incompatible-function-pointer-types" pip install --no-build-isolation -r feasibility/requirements.txt
          python scripts/phase4/check_rendered_audio.py build/tests/audio | tee build/tests/pitch-summary.txt
      - name: Check Phase 4.1 sampler lifecycle and attacks
        run: |
          build/pitch-venv/bin/pip install pyloudnorm==0.1.1
          build/pitch-venv/bin/python scripts/phase4/check_phase41.py build/tests/audio
      - name: Audit actual loop boundaries and long three-bank comparisons
        run: build/pitch-venv/bin/python scripts/phase4/check_phase42.py build/tests/comparisons
      - name: Verify isolated F sharp interpolation guard repair
        run: build/pitch-venv/bin/python scripts/phase4/check_phase43.py build/tests
      - name: Verify actual tabla waveforms against independent reference patterns
        run: |
          build/pitch-venv/bin/python -m pip install soundfile==0.13.1
          build/pitch-venv/bin/python scripts/phase5/check_renders.py build/tests/tabla
      - name: Build arm64 iPhone application without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project IndianMusic.xcodeproj \
            -scheme IndianMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build.log
      - name: Validate and package IPA
        run: bash scripts/package-ipa.sh
      - name: Launch app in iPhone simulator
        run: bash scripts/simulator-smoke.sh
      - name: Upload unsigned IPA and validation report
        uses: actions/upload-artifact@v4
        with:
          name: IndianMusic-unsigned-IPA
          path: |
            build/IndianMusic-unsigned.ipa
            build/validation.txt
            build/IndianMusic-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload equal-loudness C, C sharp and D sharp audition files
        uses: actions/upload-artifact@v4
        with:
          name: Harmonium-attack-and-loop-comparisons
          path: build/tests/listening/
          if-no-files-found: error
          retention-days: 30
      - name: Upload F sharp click comparison
        uses: actions/upload-artifact@v4
        with:
          name: Fsharp-click-before-and-after
          path: build/tests/fsharp-listening/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports and simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Phase4-tests
          path: build/tests/
          retention-days: 30
          if-no-files-found: error

      - name: Upload six tabla listening demonstrations
        uses: actions/upload-artifact@v4
        with:
          name: Phase5-six-taals-and-three-instrument-mix
          path: build/tests/tabla-listening/
          if-no-files-found: error
          retention-days: 30

  diagnose:
    if: ${{ inputs.diagnose }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile existing native comparison harness
        run: |
          mkdir -p build/diagnosis
          xcrun swiftc -parse-as-library IndianMusic/TanpuraSettings.swift IndianMusic/HarmoniumSettings.swift IndianMusic/PracticeAudioGraph.swift IndianMusic/TablaSettings.swift IndianMusic/TablaSequencer.swift scripts/tests/HarmoniumComparisonTests.swift -o build/compare
      - name: Compare fast and paced native holds, same unchanged bank
        run: |
          notes=$(seq -s, 36 72)
          build/compare "$PWD/IndianMusic/Sounds" "$PWD/build/diagnosis/fast" "$notes"
          build/compare "$PWD/IndianMusic/Sounds" "$PWD/build/diagnosis/paced" "$notes" --paced
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure long zero runs in sustained notes
        run: |
          python -m venv build/venv
          build/venv/bin/pip install numpy==1.26.4 soundfile==0.13.1
          build/venv/bin/python - <<'PY'
          import json,pathlib,numpy as np,soundfile as sf
          result={}
          for mode in ['fast','paced']:
              rows=[]
              for p in sorted(pathlib.Path('build/diagnosis',mode).glob('note_*.wav')):
                  a,sr=sf.read(p);silent=np.abs(a)<1/32768
                  transitions=np.flatnonzero(np.diff(np.pad(silent,(1,1)).astype(int)))
                  runs=[(int(b),int(e-b)) for b,e in transitions.reshape(-1,2) if b>sr and e-b>128]
                  rows.append(dict(note=p.stem,runs=runs))
              result[mode]=rows
          pathlib.Path('build/diagnosis/results.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Phase51-render-diagnosis
          path: build/diagnosis/
          retention-days: 7
