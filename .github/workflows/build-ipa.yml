name: Build unsigned iPhone IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record available Xcode and SDK
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build arm64 iPhone application without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project IndianMusic.xcodeproj \
            -scheme IndianMusic \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build.log
      - name: Validate and package IPA
        run: bash scripts/package-ipa.sh
      - name: Upload unsigned IPA and validation report
        uses: actions/upload-artifact@v4
        with:
          name: IndianMusic-unsigned-IPA
          path: |
            build/IndianMusic-unsigned.ipa
            build/validation.txt
            build/IndianMusic-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
